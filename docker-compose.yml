services:
  postgres:
    image: postgres:17-alpine
    container_name: wms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockmanager}
      POSTGRES_USER: ${POSTGRES_USER:-stockuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StockSecret2025}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockuser} -d ${POSTGRES_DB:-stockmanager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wms_network

  redis:
    image: redis:7-alpine
    container_name: wms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wms_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stockuser}:${POSTGRES_PASSWORD:-StockSecret2025}@postgres:5432/${POSTGRES_DB:-stockmanager}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@stockmanager.local}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-Admin@123456}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wms_network

volumes:
  postgres_data:
    name: wms_postgres_data
  redis_data:
    name: wms_redis_data

networks:
  wms_network:
    name: wms_network
    driver: bridge

