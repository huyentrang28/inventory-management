services:
  postgres:
    image: postgres:17-alpine
    container_name: wms_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockmanager
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: StockSecret2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stockmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wms_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms_backend_dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://stockuser:StockSecret2025@postgres:5432/stockmanager
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_secret_key_change_in_production_123456
      SUPERUSER_EMAIL: admin@stockmanager.local
      SUPERUSER_PASSWORD: Admin@123456
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_dev_data:
  redis_dev_data:

